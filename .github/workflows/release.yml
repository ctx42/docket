# Publishes the Obsidian plugin as a GitHub release when a version tag lands.
# BRAT installs from a release's assets: main.js, manifest.json, styles.css.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  plugin:
    name: publish the plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (vitest)
        run: bun run test

      - name: Build the plugin
        run: bun run --filter '@docket/obsidian-plugin' build

      - name: Stamp the manifest with the tag's version
        run: >-
          bun packages/obsidian-plugin/scripts/stage-release.ts
          "$GITHUB_REF_NAME" packages/obsidian-plugin/dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/obsidian-plugin/dist
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" --clobber \
                  main.js manifest.json styles.css
          else
              gh release create "$GITHUB_REF_NAME" \
                  --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
                  main.js manifest.json styles.css
          fi
